<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHILX Live V9.9 - Streamable Engine</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Orbitron', sans-serif; background: #000; color: #fff; overflow: hidden; }
       .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px; text-align: center; }
       .container { display: flex; height: calc(100vh - 60px); }
       .video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 10px; background: #111; overflow-y: auto; }
       .video-box { background: #222; border-radius: 10px; position: relative; overflow: hidden; border: 2px solid #FF00F5; }
       .video-box iframe,.video-box video { width: 100%; height: 100%; border: none; }
       .user-label { position: absolute; bottom: 10px; left: 10px; background: rgba(255,0,245,0.8); padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: 900; z-index: 10; }
       .live-badge { position: absolute; top: 10px; left: 10px; background: #FF0040; padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: 900; animation: blink 1s infinite; z-index: 10; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
       .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 50px; z-index: 100; }
       .btn { padding: 12px 20px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; }
       .btn.danger { background: #e74c3c; }
       .btn.success { background: #27ae60; }
       .chat { width: 300px; background: #1a1a1a; display: flex; flex-direction: column; }
       .chat-header { padding: 15px; background: #222; font-weight: bold; }
       .chat-messages { flex: 1; padding: 10px; overflow-y: auto; }
       .chat-input { display: flex; padding: 10px; }
       .chat-input input { flex: 1; padding: 10px; background: #333; border: none; color: white; border-radius: 5px; }

        /* FORM YA KUEKA LINK */
        #uploadLiveForm { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#0A0A12; padding:25px; border-radius:15px; border:2px solid #FF00F5; display:none; z-index:3000; box-shadow: 0 0 20px #FF00F5; }
        #uploadLiveForm h3 { color:#00F0FF; margin-bottom:15px; text-align:center; }
        #uploadLiveForm input { width:350px; padding:12px; margin-bottom:10px; background:#000; border:1px solid #00F0FF; color:#fff; border-radius:8px; font-family: 'Orbitron'; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>🔥 CHILX LIVE V9.9 - STREAMABLE ENGINE 🔥</h1>
    </div>

    <div class="container">
        <div class="video-grid" id="videoGrid"></div>
        <div class="chat">
            <div class="chat-header">💬 Live Chat</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Andika ujumbe...">
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn success" id="liveBtn">ANZA LIVE</button>
        <button class="btn danger" id="stopBtn" style="display:none;">TIBA LIVE</button>
    </div>

    <!-- FORM YA KUEKA LINK YA STREAMABLE -->
    <div id="uploadLiveForm">
        <h3>ANZA LIVE YAKO</h3>
        <input type="text" id="artistName" placeholder="Weka Jina lako la Msanii">
        <input type="text" id="liveVideoLink" placeholder="Bandika Link ya Streamable/Cutbox">
        <button onclick="startFakeLive()" class="btn success" style="width:100%;">ANZA LIVE</button>
        <button onclick="closeUploadForm()" class="btn danger" style="width:100%; margin-top:5px;">GHARIMI</button>
    </div>

    <script>
        // === FIREBASE SETTINGS ===
        const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentArtist = "";
        let myLiveRef = null;
        const videoGrid = document.getElementById('videoGrid');

        function showForm() { document.getElementById('uploadLiveForm').style.display = 'block'; }
        function closeUploadForm() { document.getElementById('uploadLiveForm').style.display = 'none'; }

        // MSANII AKIBONYEZA ANZA LIVE
        document.getElementById('liveBtn').onclick = () => {
            showForm();
        }

        async function startFakeLive() {
            currentArtist = document.getElementById('artistName').value.trim();
            let videoLink = document.getElementById('liveVideoLink').value.trim();

            if(!currentArtist ||!videoLink) { alert("Jaza majina yote mzee"); return; }

            let expireTime = Date.now() + (24 * 60 * 60 * 1000); // Saa 24

            myLiveRef = db.ref("live_artists/" + currentArtist);
            await myLiveRef.set({
                name: currentArtist,
                videoLink: videoLink,
                startTime: Date.now(),
                expireTime: expireTime
            });
            myLiveRef.onDisconnect().remove();

            closeUploadForm();
            document.getElementById('liveBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            alert(currentArtist + " uko LIVE sasa!");
        }

        // MSANII AKIBONYEZA TIBA
        document.getElementById('stopBtn').onclick = async () => {
            if(myLiveRef) await myLiveRef.remove();
            document.getElementById('liveBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        // KUSOMA WASANII WOTE WALIO LIVE
        db.ref("live_artists").on("value", snap => {
            let artists = snap.val() || {};
            videoGrid.innerHTML = "";
            let count = 0;
            let now = Date.now();

            for(let key in artists) {
                let data = artists[key];

                // AUTO DELETE BAADA YA SAA 24
                if(data.expireTime < now) {
                    db.ref("live_artists/" + key).remove();
                    continue;
                }
                count++;

                let box = document.createElement('div');
                box.className = 'video-box';

                // HAPA NDIO TRIKE: TUMIA IFRAME YA STREAMABLE/CUTBOX
                box.innerHTML = `
                    <div class="live-badge">🔴 LIVE</div>
                    <div class="user-label">${data.name}</div>
                    <iframe src="${data.videoLink}"
                    allow="autoplay; fullscreen"
                    allowfullscreen></iframe>
                `;
                videoGrid.appendChild(box);
            }

            // Kama hakuna mtu, onyesha ujumbe
            if(count === 0) {
                videoGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#888;">Hakuna msanii aliye LIVE kwa sasa</div>`;
            }
        });

        // CHAT RAHISI
        document.getElementById('chatInput').addEventListener("keypress", e => {
            if (e.key === "Enter") {
                let msg = e.target.value.trim();
                if(msg) {
                    db.ref("chat").push({text: msg, time: Date.now()});
                    e.target.value = "";
                }
            }
        });
        db.ref("chat").limitToLast(50).on("child_added", snap => {
            let data = snap.val();
            document.getElementById('chatMessages').innerHTML += `<div style="margin-bottom:8px;">${data.text}</div>`;
        });
    </script>
</body>
</html>
