<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHILX LIVE</title>
<link rel="icon" href="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root {
        --bg:#010101; --card:#0A0A12; --border:#1E1E2E;
        --blue-neon:#00F0FF; --pink-neon:#FF00F5; --text:#E0E0FF; --error:#FF0040;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; justify-content: center; overflow: hidden; }

    .app-container { width: 100%; max-width: 500px; background: #000; border-left: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; position: relative; }
   
    .header { background: #05050A; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 15px rgba(0,240,255,0.1); }
    .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .logo img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); box-shadow: 0 0 10px var(--blue-neon); }
    .logo h1 { font-size: 20px; font-weight: 900; color: var(--blue-neon); text-shadow: 0 0 8px var(--blue-neon); }
    .logo h1 span { color: var(--pink-neon); text-shadow: 0 0 8px var(--pink-neon); }
    
    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-profile { display: flex; align-items: center; gap: 8px; }
    .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); }
    .user-name { font-size: 12px; font-weight: 700; color: var(--blue-neon); display: flex; align-items: center; gap: 4px; }
    .signout-btn { background: var(--error); color: #fff; border: none; padding: 5px 10px; border-radius: 5px; font-size: 10px; font-family: 'Orbitron'; cursor: pointer; }

    .login-screen { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; background: var(--bg); position: absolute; top: 0; left: 0; z-index: 1000; }
    .login-screen img { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 20px; border: 3px solid var(--pink-neon); object-fit: cover; box-shadow: 0 0 20px var(--pink-neon); }
    .login-screen h2 { color: var(--blue-neon); text-shadow: 0 0 10px var(--blue-neon); margin-bottom: 5px; }
    .login-screen select, .login-screen input { width: 90%; background: var(--card); border: 1px solid var(--blue-neon); color: #fff; padding: 14px; margin-bottom: 15px; border-radius: 8px; font-size: 16px; box-shadow: 0 0 5px var(--blue-neon); font-family: 'Orbitron'; text-align: center; text-align-last: center; outline: none; }
    .login-screen button { background: linear-gradient(90deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; padding: 14px; width: 90%; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 16px; font-family: 'Orbitron'; }

    .media-indicators { background: #050510; border-bottom: 1px solid var(--border); padding: 8px 15px; display: flex; justify-content: space-around; font-size: 11px; }
    .indicator-btn { background: none; border: 1px dashed var(--pink-neon); padding: 4px 10px; border-radius: 4px; color: var(--pink-neon); font-family: 'Orbitron'; cursor: pointer; }
    .indicator-btn.active { background: var(--pink-neon); color: #000; font-weight: 900; box-shadow: 0 0 10px var(--pink-neon); }

    .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: rgba(10,10,18,0.4); }
    
    .msg-wrapper { display: flex; gap: 10px; max-width: 85%; }
    .msg-wrapper.outgoing { align-self: flex-end; flex-direction: row-reverse; }
    .msg-wrapper.incoming { align-self: flex-start; }
    .msg-pfp { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink-neon); flex-shrink: 0; }
    .msg { font-size: 14px; padding: 10px 14px; border-radius: 12px; line-height: 1.4; border: 1px solid var(--border); box-shadow: 0 0 8px rgba(0,0,0,0.3); cursor: pointer; }
    .msg.incoming { background: var(--card); border-left: 3px solid var(--pink-neon); }
    .msg.outgoing { background: #111424; border-right: 3px solid var(--blue-neon); color: #fff; }
    .msg-header { color: var(--blue-neon); display: flex; align-items: center; gap: 4px; font-size: 11px; margin-bottom: 4px; letter-spacing: 1px; font-weight: 700; }
    
    .v-badge { width: 14px; height: 14px; background: #0095F6; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; }
    .v-badge svg { width: 9px; height: 9px; fill: #fff; }

    .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
    .msg iframe { width: 100%; aspect-ratio: 16/9; border-radius: 8px; margin-top: 5px; border: none; }
    .voice-player audio { width: 200px; height: 30px; }

    .input-area { padding: 15px; background: #05050A; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .chat-input { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px 18px; border-radius: 25px; font-family: 'Orbitron'; font-size: 14px; }
    .chat-input:focus { border-color: var(--blue-neon); outline: none; box-shadow: 0 0 8px rgba(0,240,255,0.2); }
   
    .media-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text); padding: 0 5px; transition: 0.2s; }
    .media-btn:hover { color: var(--blue-neon); text-shadow: 0 0 8px var(--blue-neon); }
    .media-btn.recording { color: var(--pink-neon); animation: pulse 1s infinite; }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }
    .send-btn { background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-weight: 900; font-size: 18px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px var(--pink-neon); }

    #cameraModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
    #cameraVideo { width: 100%; height: 80%; object-fit: cover; }
    #closeCamera { position: absolute; top: 20px; right: 20px; background: var(--pink-neon); color: #000; border: none; padding: 10px 15px; border-radius: 50%; font-weight: 900; cursor: pointer; }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
    <h2>CHILX <span style="color:var(--pink-neon);">LIVE</span></h2>
    <p style="color:#888; font-size:11px; margin-bottom:25px; letter-spacing:1px;">MTANDAO RASMI WA WASANII SABA</p>
   
    <select id="loginUsername">
        <option value="" disabled selected>Chagua Jina Lako la Game</option>
        <option value="ZORAVALY">ZORAVALY</option>
        <option value="PAUL">PAUL</option>
        <option value="WILLIAMS">WILLIAMS</option>
        <option value="MASON">MASON</option>
        <option value="SHANIYA">SHANIYA</option>
        <option value="IRENE">IRENE</option>
        <option value="ZAISAN">ZAISAN</option>
    </select>

    <input type="text" id="loginPfp" placeholder="Weka Link ya Profile Pic yako: postimg.cc/...">
   
    <button onclick="login()">INGIA KWENYE GROUP</button>
</div>

<div id="mainApp" class="app-container" style="display:none;">
    <div class="header">
        <div class="logo">
            <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
            <h1>CHILX <span>LIVE</span></h1>
        </div>
        <div class="header-right">
            <div class="user-profile" id="userProfile"></div>
            <button class="signout-btn" onclick="signOut()">EXIT</button>
        </div>
    </div>

    <div class="media-indicators">
        <button class="indicator-btn" id="liveVideoIndicator" onclick="openCamera()">📹 LIVE VIDEO</button>
        <button class="indicator-btn" id="voiceNoteIndicator">🎙️ VOICE NOTE</button>
    </div>

    <div class="chat-area" id="chatBox"></div>

    <div class="input-area">
        <button class="media-btn" onclick="sendMedia()">📎</button>
        <button class="media-btn" id="voiceBtn">🎙️</button>
       
        <input type="text" id="msgInput" class="chat-input" placeholder="Andika SMC au bandika link ya media...">
        <button class="send-btn" onclick="sendMessage()">></button>
    </div>
</div>

<div id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <button id="closeCamera" onclick="closeCamera()">X</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";
    let currentPfp = "";
    const verifiedArtists = ["ZORAVALY", "PAUL", "WILLIAMS", "MASON", "SHANIYA", "IRENE", "ZAISAN"];
    let cameraStream = null;
    let mediaRecorder, audioChunks = [];

    window.onload = function() {
        let savedUser = localStorage.getItem('chilxUser');
        let savedPfp = localStorage.getItem('chilxPfp');
        if(savedUser && savedPfp) {
            currentUser = savedUser;
            currentPfp = savedPfp;
            enterApp();
        }
    }

    function login() {
        let name = document.getElementById('loginUsername').value;
        let pfp = document.getElementById('loginPfp').value.trim();
        if(!name) { alert("Tafadhali chagua Jina lako la usanii!"); return; }
        if(!pfp) { alert("Tafadhali weka Link ya Profile Pic yako!"); return; }
       
        currentUser = name;
        currentPfp = pfp;
        
        localStorage.setItem('chilxUser', currentUser);
        localStorage.setItem('chilxPfp', currentPfp);
        db.ref("users/" + currentUser).set({pfp: currentPfp, name: currentUser});

        enterApp();
    }

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        
        let badge = verifiedArtists.includes(currentUser) ? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
        document.getElementById('userProfile').innerHTML = `<img src="${currentPfp}"><div class="user-name">${currentUser}${badge}</div>`;

        listenToGroupChat();
        setupVoiceRecorder();
    }

    // SIGN OUT FUNCTION MPYA
    function signOut() {
        if(confirm("Una uhakika unataka kutoka? Kumbukumbu za majaribio zitafutwa")) {
            localStorage.removeItem('chilxUser');
            localStorage.removeItem('chilxPfp');
            location.reload();
        }
    }

    function listenToGroupChat() {
        db.ref("group_messages").limitToLast(40).on("child_added", function(snapshot) {
            let data = snapshot.val();
            let key = snapshot.key;
            let chatBox = document.getElementById('chatBox');

            let wrapper = document.createElement('div');
            wrapper.id = "msg-" + key;
            wrapper.className = (data.sender === currentUser) ? "msg-wrapper outgoing" : "msg-wrapper incoming";
           
            let badge = verifiedArtists.includes(data.sender) ? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
            let content = data.text;

            if(data.type === 'voice') {
                content = `<div class="voice-player"><audio controls src="${data.text}"></audio></div>`;
            } else if(content.match(/\.(jpeg|jpg|gif|png)$/) || content.includes("postimg.cc")) {
                content = `<img src="${content}">`;
            } else if(content.includes("youtube.com") || content.includes("streamable.com") || content.includes("vimeo")) {
                content = `<iframe src="${content}" allowfullscreen></iframe>`;
            }

            wrapper.innerHTML = `
                <img class="msg-pfp" src="${data.pfp || 'https://i.postimg.cc/vBJj3bNH/chilx-live.jpg'}">
                <div class="msg ${data.sender === currentUser ? 'outgoing' : 'incoming'}" ondblclick="deleteMessage('${key}', '${data.sender}')">
                    <div class="msg-header">${data.sender}${badge}</div>
                    ${content}
                </div>
            `;
           
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    // DELETE FUNCTION MPYA
    function deleteMessage(key, sender) {
        if(sender === currentUser) {
            if(confirm("Futa ujumbe huu?")) {
                db.ref("group_messages/" + key).remove();
                document.getElementById("msg-" + key).remove();
            }
        }
    }

    function sendMessage() {
        let input = document.getElementById('msgInput');
        let text = input.value.trim();
        if (text === "") return;
       
        db.ref("group_messages").push().set({
            sender: currentUser, pfp: currentPfp, type: 'text', text: text, timestamp: Date.now()
        });
        input.value = "";
    }

    function sendMedia() {
        let link = prompt(`POSTI PICHA AU VIDEO:\n\n1. Picha: Weka link ya postimg.cc\n2. Video: Weka link ya youtube.com au streamable.com\nBandika link hapa:`);
        if(!link) return;
        db.ref("group_messages").push().set({
            sender: currentUser, pfp: currentPfp, type: 'media', text: link, timestamp: Date.now()
        });
    }

    function setupVoiceRecorder() {
        const voiceBtn = document.getElementById('voiceBtn');
        voiceBtn.onmousedown = startRecording;
        voiceBtn.onmouseup = stopRecording;
        voiceBtn.ontouchstart = startRecording;
        voiceBtn.ontouchend = stopRecording;
    }
    async function startRecording() {
        document.getElementById('voiceBtn').classList.add('recording');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        mediaRecorder.start();
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    }
    function stopRecording() {
        document.getElementById('voiceBtn').classList.remove('recording');
        if(!mediaRecorder) return;
        mediaRecorder.stop();
        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob); 
            reader.onloadend = () => {
                const base64Audio = reader.result;
                db.ref("group_messages").push().set({
                    sender: currentUser, pfp: currentPfp, type: 'voice', text: base64Audio, timestamp: Date.now()
                });
            }
        };
    }

    async function openCamera() {
        document.getElementById('cameraModal').style.display = 'flex';
        document.getElementById('liveVideoIndicator').classList.add('active');
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
            document.getElementById('cameraVideo').srcObject = cameraStream;
        } catch(err) {
            alert("Ruhusu camera na microphone tafadhali");
            closeCamera();
        }
    }
    function closeCamera() {
        document.getElementById('cameraModal').style.display = 'none';
        document.getElementById('liveVideoIndicator').classList.remove('active');
        if(cameraStream) cameraStream.getTracks().forEach(track => track.stop());
    }

    document.getElementById('msgInput').addEventListener("keypress", function(e) { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
