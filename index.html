<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHILX NETWORK</title>
<link rel="icon" href="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    :root { --bg:#000; --card:#0a0a0a; --border:#1a1a1a; --red:#D90429; --gold:#FFD700; --text:#E0E0E0; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin:0; padding-bottom: 70px; }

   .header { background: #050505; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index: 100; }
   .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
   .logo img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--red); }
   .logo h1 { font-size: 20px; font-weight: 700; margin: 0; color: var(--gold); }

   .container { max-width: 600px; margin: 0 auto; }
   .login-screen { text-align: center; padding: 40px 20px; }
   .login-screen img { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 20px; }
   .login-screen input { width: 90%; background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
   .login-screen button { background: var(--red); color: #fff; border: none; padding: 12px; width: 90%; border-radius: 8px; font-weight: 700; cursor: pointer; }

   .post { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin: 15px 0; }
   .post-header { display: flex; align-items: center; padding: 12px; gap: 10px; }
   .post-header img { width: 32px; height: 32px; border-radius: 50%; background: #222; }
   .post-user { font-weight: 600; font-size: 14px; }
   .v-badge { color: #0095f6; }
   .post-body img,.post-body iframe { width: 100%; border-radius: 0; }
   .post-actions { padding: 10px 12px; display: flex; gap: 15px; font-size: 20px; }
   .post-actions span { cursor: pointer; }
   .liked { color: var(--red); }
   .post-caption { padding: 0 12px 12px; font-size: 14px; }
   .post-caption strong { color: var(--gold); }

   .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #050505; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
   .bottom-nav button { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
   .post-btn { background: var(--red)!important; color: #000!important; width: 45px; height: 45px; border-radius: 12px; font-size: 28px!important; margin-top: -5px; }

   .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; }
   .modal-content { background: var(--card); padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; }
   .modal-content h3 { color: var(--gold); margin-top: 0; }
   .modal-content input,.modal-content textarea,.modal-content select { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
   .modal-content button { background: var(--red); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; }

   .admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 20px; overflow-y: auto; }
   .admin-active { display: block; }
   .admin-header { color: var(--red); font-size: 1.5rem; margin-bottom: 20px; text-align: center; }
   .admin-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 12px; margin: 4px; cursor: pointer; border-radius: 4px; }
   .admin-btn.danger { background: var(--red); }
   .admin-btn.verify { background: #0095f6; }
   .user-row { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
    <h2>Karibu CHILX NETWORK</h2>
    <input type="text" id="loginUsername" placeholder="Weka Jina la Mtumiaji">
    <button onclick="login()">INGIA</button>
</div>

<div id="mainApp" style="display:none;">
    <div class="header">
        <div class="logo" onclick="handleLogoClick()">
            <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg">
            <h1>CHILX NETWORK</h1>
        </div>
    </div>

    <div class="container" id="feed"></div>

    <div class="bottom-nav">
        <button>🏠</button>
        <button class="post-btn" onclick="openPostModal()">+</button>
        <button>👤</button>
    </div>
</div>

<div id="postModal" class="modal">
    <div class="modal-content">
        <h3>TENGENEZA POST MPYA</h3>
        <select id="postType">
            <option value="post">POST YA PICHA/LINK</option>
            <option value="reel">REEL/VIDEO LINK</option>
        </select>
        <input id="postTitle" placeholder="Title ya Post">
        <input id="postLink" placeholder="Weka Link ya YouTube, Picha, etc">
        <textarea id="postDesc" placeholder="Andika maelezo..." rows="3"></textarea>
        <button onclick="sendPost()">POST</button>
        <button style="background:#333; margin-top:10px;" onclick="closePostModal()">Funga</button>
    </div>
</div>

<div class="admin-panel" id="adminPanel">
    <div class="admin-header">DIRECTOR CONTROL CENTER</div>
    <div style="background:#111; padding:12px; border-radius:4px; margin-bottom:20px;">
        <p>Badilisha Password ya Siri:</p>
        <input id="newPassInput" type="text" placeholder="Password Mpya..." style="background:#000; border:1px solid #333; color:#fff; padding:8px; width: 70%;">
        <button class="admin-btn" onclick="changeSecretPassword()">Hifadhi</button>
    </div>
    <h3>WACHEZAJI:</h3>
    <div id="adminUserList"></div>
    <button class="admin-btn danger" style="width:100%; margin-top:20px; padding:12px;" onclick="closeAdmin()">Funga Panel</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, get, update, remove, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGne9pWm-czJUJgtvsvNGnPXMpXi4vxDY",
  authDomain: "chilx-live.firebaseapp.com",
  databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com",
  projectId: "chilx-live",
  storageBucket: "chilx-live.firebasestorage.app",
  messagingSenderId: "298470644583",
  appId: "1:298470644583:web:bb7606e8e68518476bedc2"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const postsRef = ref(db, "posts");
const usersRef = ref(db, "users");
const adminRef = ref(db, "admin");

let currentUser = "";
let logoClicks = 0;

get(adminRef).then(snap => { if(!snap.exists()) set(adminRef, {password: "CHILX Director"}) });

// LOGIN
window.login = function() {
    currentUser = document.getElementById('loginUsername').value.trim();
    if(!currentUser) return alert("Tafadhali weka jina");
    set(ref(db, 'users/' + currentUser), {verified: false});
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
}

// POST MODAL
window.openPostModal = () => document.getElementById('postModal').style.display = 'flex';
window.closePostModal = () => document.getElementById('postModal').style.display = 'none';

// TUMA POST
window.sendPost = function() {
    const type = document.getElementById('postType').value;
    const title = document.getElementById('postTitle').value.trim();
    const link = document.getElementById('postLink').value.trim();
    const desc = document.getElementById('postDesc').value.trim();
    if(!title ||!link) return alert("Jaza Title na Link");
    push(postsRef, {user: currentUser, type:type, title, link, desc, likes: 0, likedBy: {}, comments: {}, time: Date.now()});
    closePostModal();
}

// ONYESHA FEED
onValue(postsRef, (snap) => {
    const feed = document.getElementById('feed');
    feed.innerHTML = "";
    const posts = [];
    snap.forEach(child => posts.push({id: child.key,...child.val()}));
    posts.sort((a,b) => b.time - a.time);
    posts.forEach(post => {
        get(ref(db, 'users/' + post.user)).then(uSnap => {
            const verified = uSnap.exists() && uSnap.val().verified? '<span class="v-badge">☑</span>' : '';
            const liked = post.likedBy && post.likedBy[currentUser]? 'liked' : '';
            const media = post.type === 'reel'? `<iframe src="${post.link}" frameborder="0" allowfullscreen></iframe>` : `<img src="${post.link}">`;
            feed.innerHTML += `
            <div class="post">
                <div class="post-header"><img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg"><div><div class="post-user">${post.user}${verified}</div></div></div>
                <div class="post-body">${media}</div>
                <div class="post-actions"><span class="${liked}" onclick="likePost('${post.id}')">❤️ ${post.likes || 0}</span></div>
                <div class="post-caption"><strong>${post.user}</strong> ${post.title}: ${post.desc}</div>
            </div>`;
        })
    })
});

// LIKE
window.likePost = function(postId) {
    const postRef = ref(db, 'posts/' + postId);
    get(postRef).then(snap => {
        const post = snap.val();
        if(!post.likedBy) post.likedBy = {};
        if(post.likedBy[currentUser]) { post.likes--; delete post.likedBy[currentUser]; }
        else { post.likes = (post.likes || 0) + 1; post.likedBy[currentUser] = true; }
        update(postRef, {likes: post.likes, likedBy: post.likedBy});
    })
}

// ADMIN PANEL - BONYEZA LOGO MARA 5
window.handleLogoClick = function() {
    logoClicks++;
    setTimeout(() => { logoClicks = 0; }, 3000);
    if (logoClicks >= 5) {
        logoClicks = 0;
        let pass = prompt("INGIZA PASSWORD YA DIRECTOR:");
        get(adminRef).then(snap => {
            if (snap.val().password === pass) { document.getElementById('adminPanel').classList.add('admin-active'); loadUsers(); }
            else alert("PASSWORD SIO SAHI!");
        })
    }
}
window.closeAdmin = () => document.getElementById('adminPanel').classList.remove('admin-active');
window.changeSecretPassword = () => { const newP = document.getElementById('newPassInput').value; if(newP.length < 4) return alert("Password fupi"); update(adminRef, {password: newP}); alert("Imehifadhiwa!"); }
function loadUsers() { get(usersRef).then(snap => { let html = ""; snap.forEach(child => { const u = child.key; const d = child.val(); html += `<div class="user-row"><div><strong>${u}</strong><br><span style="color:#666;">${d.verified? "Verified ☑" : "Unverified"}</span></div><div><button class="admin-btn verify" onclick="verifyUser('${u}')">Verify</button><button class="admin-btn danger" onclick="deleteUser('${u}')">Futa</button></div></div>`; }); document.getElementById('adminUserList').innerHTML = html; }) }
window.verifyUser = (u) => { update(ref(db, 'users/' + u), {verified: true}); loadUsers(); }
window.deleteUser = (u) => { if(confirm("Futa "+u+"?")) remove(ref(db, 'users/' + u)); loadUsers(); }
</script>
</body>
</html>
