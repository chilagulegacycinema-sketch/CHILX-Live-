<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHILX Live V9.8 - Multi Host</title>
    <script src="https://cdn.agora.io/sdk/release/AgoraRTC_N.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #000; color: #fff; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px; text-align: center; }
        .container { display: flex; height: calc(100vh - 60px); }
        .video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 10px; background: #111; }
        .video-box { background: #222; border-radius: 10px; position: relative; overflow: hidden; border: 2px solid #333; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .user-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 50px; }
        .btn { padding: 12px 20px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; font-weight: bold; }
        .btn.danger { background: #e74c3c; }
        .btn.success { background: #27ae60; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat { width: 300px; background: #1a1a1a; display: flex; flex-direction: column; }
        .chat-header { padding: 15px; background: #222; font-weight: bold; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; }
        .chat-input { display: flex; padding: 10px; }
        .chat-input input { flex: 1; padding: 10px; background: #333; border: none; color: white; border-radius: 5px; }
        .status { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #27ae60; padding: 10px 20px; border-radius: 20px; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 CHILX LIVE V9.8 - Virtual Concert 🔥</h1>
    </div>

    <div class="container">
        <div class="video-grid" id="videoGrid">
            <div class="video-box" id="localPlayer">
                <div class="user-label">Wewe</div>
            </div>
        </div>

        <div class="chat">
            <div class="chat-header">💬 Live Chat</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Andika ujumbe...">
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn success" id="joinBtn">INGIA LIVE</button>
        <button class="btn danger" id="leaveBtn" disabled>Toka LIVE</button>
        <button class="btn" id="micBtn">Mic: ON</button>
        <button class="btn" id="camBtn">Camera: ON</button>
    </div>

    <div class="status" id="status"></div>

    <script>
        // === SETTINGS ZAKO ===
        const APP_ID = "410cf579f7ec4536b505e50f0fdc5119";
        const CHANNEL = "chilx_live_room";
        const TOKEN = null; // Tumechagua App ID only

        // === AGORA CLIENT ===
        const client = AgoraRTC.createClient({ mode: "live", codec: "vp8" });
        client.setClientRole("host"); // Kila mtu ni host

        let localTracks = { videoTrack: null, audioTrack: null };
        let remoteUsers = {};
        let joined = false;

        const joinBtn = document.getElementById('joinBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const micBtn = document.getElementById('micBtn');
        const camBtn = document.getElementById('camBtn');
        const videoGrid = document.getElementById('videoGrid');
        const status = document.getElementById('status');

        function showStatus(msg) {
            status.innerText = msg;
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        }

        // Mtu mpya akiingia
        client.on("user-published", async (user, mediaType) => {
            await client.subscribe(user, mediaType);
            remoteUsers[user.uid] = user;
            
            const player = document.createElement('div');
            player.className = 'video-box';
            player.id = `user-${user.uid}`;
            player.innerHTML = `<div class="user-label">Msanii ${user.uid}</div>`;
            videoGrid.appendChild(player);

            if (mediaType === "video") {
                user.videoTrack.play(`user-${user.uid}`);
            }
            if (mediaType === "audio") {
                user.audioTrack.play();
            }
            showStatus(`Msanii ${user.uid} ameungana`);
        });

        // Mtu akitoka
        client.on("user-unpublished", (user) => {
            delete remoteUsers[user.uid];
            document.getElementById(`user-${user.uid}`)?.remove();
            showStatus(`Msanii ${user.uid} ametoka`);
        });

        // INGIA LIVE
        joinBtn.onclick = async () => {
            try {
                showStatus("Tunaungana...");
                await client.join(APP_ID, CHANNEL, TOKEN, null);
                
                localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack();
                
                localTracks.videoTrack.play("localPlayer");
                await client.publish(Object.values(localTracks));
                
                joined = true;
                joinBtn.disabled = true;
                leaveBtn.disabled = false;
                showStatus("Uko LIVE! Watu wanakuona");
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        // TOKA LIVE
        leaveBtn.onclick = async () => {
            for (let track of Object.values(localTracks)) {
                track.stop();
                track.close();
            }
            await client.leave();
            joined = false;
            joinBtn.disabled = false;
            leaveBtn.disabled = true;
            showStatus("Umetoka LIVE");
        };

        // ZIMA/WASHA MIC
        micBtn.onclick = async () => {
            if (localTracks.audioTrack) {
                await localTracks.audioTrack.setEnabled(!localTracks.audioTrack.enabled);
                micBtn.innerText = `Mic: ${localTracks.audioTrack.enabled ? 'ON' : 'OFF'}`;
            }
        };

        // ZIMA/WASHA CAMERA
        camBtn.onclick = async () => {
            if (localTracks.videoTrack) {
                await localTracks.videoTrack.setEnabled(!localTracks.videoTrack.enabled);
                camBtn.innerText = `Camera: ${localTracks.videoTrack.enabled ? 'ON' : 'OFF'}`;
            }
        };
    </script>
</body>
</html>
