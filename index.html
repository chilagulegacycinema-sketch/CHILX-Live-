<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHILX LIVE CHANNEL</title>
<link rel="icon" href="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root {
        --bg:#010101; --card:#0A0A12; --border:#1E1E2E;
        --blue-neon:#00F0FF; --pink-neon:#FF00F5; --text:#E0E0FF; --error:#FF0040;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; justify-content: center; overflow: hidden; }

   .app-container { width: 100%; max-width: 500px; background: #000; border-left: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }

   .header { background: #05050A; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
   .logo { display: flex; align-items: center; gap: 10px; }
   .logo img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); }
   .logo h1 { font-size: 18px; font-weight: 900; color: var(--blue-neon); }
   .logo h1 span { color: var(--pink-neon); }

   .live-status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--error); font-weight: 900; cursor: pointer; padding: 4px 8px; border-radius: 12px; background: rgba(255,0,64,0.1); }
   .live-dot { width: 8px; height: 8px; background: var(--error); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

   .user-profile { display: flex; align-items: center; gap: 8px; cursor: pointer; }
   .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); }
   .user-name { font-size: 12px; font-weight: 700; color: var(--blue-neon); display: flex; align-items: center; gap: 4px; }

   .login-screen { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; background: var(--bg); position: absolute; top: 0; left: 0; z-index: 1000; }
   .login-screen img { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 20px; border: 3px solid var(--pink-neon); }
   .login-screen h2 { color: var(--blue-neon); }
   .login-screen input { width: 90%; background: var(--card); border: 1px solid var(--blue-neon); color: #fff; padding: 14px; margin: 15px 0; border-radius: 8px; font-size: 16px; font-family: 'Orbitron'; text-align: center; }
   .login-screen button { background: linear-gradient(90deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; padding: 14px; width: 90%; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 16px; font-family: 'Orbitron'; margin-bottom: 10px; }

   .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: rgba(10,10,18,0.4); }

   .post { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; position: relative; }
   .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
   .post-pfp { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink-neon); }
   .post-name { font-size: 12px; font-weight: 700; color: var(--blue-neon); display: flex; align-items: center; gap: 4px; }
   .post-time { font-size: 9px; color: #888; }
   .post-content { font-size: 14px; line-height: 1.4; }
   .post-content img { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); }
   .post-content iframe { width: 100%; aspect-ratio: 16/9; border-radius: 8px; margin-top: 8px; border: 1px solid var(--border); }

   .v-badge { width: 14px; height: 14px; background: #0095F6; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; }
   .v-badge svg { width: 9px; height: 9px; fill: #fff; }
   .post-settings { position: absolute; top: 10px; right: 10px; font-size: 18px; color: #888; cursor: pointer; }

   .love-btn { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon)); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 999; }
   .love-btn svg { width: 28px; height: 28px; fill: #000; }
   .love-animation { position: absolute; animation: fly 1.5s forwards; }
   .love-animation svg { width: 25px; height: 25px; fill: var(--pink-neon); }
    @keyframes fly { 0%{opacity:1; transform:translateY(0) scale(1)} 100%{opacity:0; transform:translateY(-120px) scale(1.5)} }

   .input-area { padding: 15px; background: #05050A; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
   .chat-input { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px 18px; border-radius: 25px; font-family: 'Orbitron'; font-size: 14px; }
   .send-btn { background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-weight: 900; font-size: 18px; }

    #cameraModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 2000; }
    #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
   .live-overlay { position: absolute; top: 20px; left: 20px; background: var(--error); padding: 6px 14px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 900; }

    #danmakuContainer { position: absolute; top: 80px; left: 0; width: 100%; height: calc(100% - 160px); pointer-events: none; overflow: hidden; }
   .danmaku { position: absolute; white-space: nowrap; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 0 5px #000; animation: danmakuMove 7s linear; display: flex; align-items: center; gap: 6px; background: rgba(0,240,255,0.1); padding: 4px 10px; border-radius: 15px; border: 1px solid var(--blue-neon); }
   .danmaku img { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--pink-neon); }
    @keyframes danmakuMove { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    .live-chat-input { position:absolute; bottom:20px; left:10px; right:10px; display:none; gap:10px; }

    /* UKURASA WA PROFILE YA MSANII */
   .profile-page { display: none; flex-direction: column; height: 100%; }
   .profile-header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); }
   .profile-header img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--blue-neon); margin-bottom: 10px; cursor: pointer; }
   .back-btn { background: none; border: 1px solid var(--blue-neon); color: var(--blue-neon); padding: 5px 12px; border-radius: 15px; font-size: 10px; cursor: pointer; margin-bottom: 10px; }
   .edit-pfp-btn { font-size: 10px; color: var(--pink-neon); cursor: pointer; }
   .logout-btn { background: var(--error); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 15px; font-family: 'Orbitron'; }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
    <h2>CHILX <span style="color:var(--pink-neon);">LIVE</span></h2>
    <input type="text" id="loginName" placeholder="Weka Jina lako">
    <input type="text" id="loginPfp" placeholder="Weka Link ya Picha yako: postimg.cc">
    <button onclick="loginAsArtist()">INGIA KAMA MSANII</button>
    <button onclick="loginAsViewer()">INGIA KAMA MTAZAMAJI</button>
</div>

<div id="mainApp" class="app-container" style="display:none;">
    <div class="header">
        <div class="logo">
            <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
            <h1>CHILX <span>LIVE</span></h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="live-status" onclick="handleLiveClick()">
                <div class="live-dot"></div>
                <span id="liveCount">0 LIVE</span>
            </div>
            <div class="user-profile" id="userProfile" onclick="openProfile()"></div>
        </div>
    </div>

    <div id="channelView">
        <div class="chat-area" id="chatBox"></div>
        <div class="input-area" id="artistInput">
            <input type="text" id="msgInput" class="chat-input" placeholder="Andika post au bandika link ya picha/video...">
            <button class="send-btn" onclick="sendPost()">></button>
        </div>
        <div class="love-btn" id="loveBtn" onclick="sendLove()">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
    </div>

    <div id="profilePage" class="profile-page">
        <div class="profile-header">
            <button class="back-btn" onclick="backToChannel()">← RUDI CHANNEL</button>
            <img id="profilePagePfp" src="" onclick="changeProfilePic()">
            <div class="edit-pfp-btn" onclick="changeProfilePic()">Badili Picha</div>
            <h2 id="profilePageName"></h2>
            <button class="logout-btn" onclick="logout()">TOKA ACCOUNT</button> <!-- HAPA NDIO SIGN OUT -->
            <p style="color:#888;font-size:11px; margin-top:15px;">Post zako</p>
        </div>
        <div class="chat-area" id="profilePosts"></div>
    </div>

</div>

<div id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="live-overlay">
        <div class="live-dot"></div>
        <span>LIVE • <span id="liveViewers">1</span> WAKITAZAMA</span>
    </div>
    <div id="danmakuContainer"></div>
    <div class="live-chat-input" id="liveChatInput">
        <input type="text" id="liveComment" placeholder="Tuma ujumbe..." style="flex:1; background:rgba(0,0,0,0.6); border:1px solid var(--blue-neon); color:#fff; padding:10px; border-radius:20px; font-family:Orbitron;">
        <button onclick="sendDanmaku()" style="background:var(--pink-neon); border:none; padding:10px 15px; border-radius:20px; color:#000; font-weight:900;">TUMA</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";
    let currentPfp = "";
    let userRole = "";
    const artistsList = ["ZORAVALY", "PAUL", "WILLIAMS", "MASON", "SHANIYA", "IRENE", "ZAISAN"];
    let cameraStream = null;
    let isArtist = false;

    function loginAsArtist() {
        let name = document.getElementById('loginName').value.trim();
        let pfp = document.getElementById('loginPfp').value.trim();
        if(!name ||!pfp) { alert("Jaza majina yote"); return; }
        setupUser(name, pfp, "artist");
    }
    function loginAsViewer() {
        let name = document.getElementById('loginName').value.trim();
        let pfp = document.getElementById('loginPfp').value.trim() || "https://i.postimg.cc/vBJj3bNH/chilx-live.jpg";
        if(!name) { alert("Weka jina lako"); return; }
        setupUser(name, pfp, "viewer");
    }
    function setupUser(name, pfp, role) {
        currentUser = name; currentPfp = pfp; userRole = role;
        isArtist = artistsList.includes(currentUser.toUpperCase());
        localStorage.setItem('chilxUser', currentUser);
        localStorage.setItem('chilxPfp', currentPfp);
        db.ref("online/" + currentUser).set({pfp: currentPfp});
        db.ref("online/" + currentUser).onDisconnect().remove();
        enterApp();
    }

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        let badge = isArtist? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
        document.getElementById('userProfile').innerHTML = `<img src="${currentPfp}"><div class="user-name">${currentUser}${badge}</div>`;
        if(userRole === "viewer") {
            document.getElementById('artistInput').style.display = 'none';
            document.getElementById('loveBtn').style.display = 'flex';
            document.getElementById('userProfile').onclick = null;
        }
        listenToOnlineCount();
        listenToChannel();
        listenToDanmaku();
    }

    // SIGN OUT FUNCTION
    function logout() {
        if(confirm("Una uhakika unataka kutoka?")) {
            db.ref("online/" + currentUser).remove(); // Mtoe kwenye online
            localStorage.removeItem('chilxUser');
            localStorage.removeItem('chilxPfp');
            location.reload(); // Rudisha kwenye login
        }
    }

    function openProfile() {
        if(userRole!== "artist") return;
        document.getElementById('channelView').style.display = 'none';
        document.getElementById('profilePage').style.display = 'flex';
        document.getElementById('profilePagePfp').src = currentPfp;
        document.getElementById('profilePageName').innerText = currentUser;
        loadMyPosts();
    }
    function backToChannel() {
        document.getElementById('channelView').style.display = 'block';
        document.getElementById('profilePage').style.display = 'none';
    }
    function changeProfilePic() {
        let newPfp = prompt("Weka link mpya ya picha yako:");
        if(newPfp) {
            currentPfp = newPfp;
            localStorage.setItem('chilxPfp', currentPfp);
            db.ref("online/" + currentUser).update({pfp: currentPfp});
            document.getElementById('profilePagePfp').src = currentPfp;
            document.getElementById('userProfile').querySelector('img').src = currentPfp;
        }
    }
    function loadMyPosts() {
        document.getElementById('profilePosts').innerHTML = "";
        db.ref("channel_posts").orderByChild("sender").equalTo(currentUser).on("child_added", snap => {
            renderMyPost(snap.key, snap.val());
        });
    }
    function renderMyPost(key, data) {
        let content = getMediaContent(data.text);
        document.getElementById('profilePosts').innerHTML += `
            <div class="post" id="my-post-${key}">
                <div class="post-settings" onclick="postOptions('${key}')">⋮</div>
                <div class="post-header"><img class="post-pfp" src="${data.pfp}"><div class="post-name">${data.sender}</div></div>
                <div class="post-content">${content}</div>
            </div>
        `;
    }
    function postOptions(key) {
        let action = prompt("1. Futa Post\n2. Hariri Post");
        if(action == "1") {
            if(confirm("Una uhakika?")) {
                db.ref("channel_posts/" + key).remove();
                document.getElementById("my-post-" + key).remove();
            }
        }
        if(action == "2") {
            let newText = prompt("Andika maandishi mapya:");
            if(newText) { db.ref("channel_posts/" + key + "/text").set(newText); location.reload(); }
        }
    }

    function handleLiveClick() { openCamera(); }

    function listenToOnlineCount() {
        db.ref("online").on("value", snap => {
            let count = snap.numChildren();
            document.getElementById('liveCount').innerText = count + " LIVE";
            document.getElementById('liveViewers').innerText = count;
        });
    }
    function sendLove() {
        let love = document.createElement('div');
        love.className = 'love-animation';
        love.style.left = Math.random() * 300 + 50 + 'px';
        love.style.bottom = '80px';
        love.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        document.body.appendChild(love);
        setTimeout(() => love.remove(), 1500);
    }
    function sendDanmaku() {
        if(!isArtist) return;
        let text = document.getElementById('liveComment').value.trim();
        if(!text) return;
        db.ref("live_comments").push({sender: currentUser, pfp: currentPfp, text: text});
        document.getElementById('liveComment').value = "";
    }
    function listenToDanmaku() {
        db.ref("live_comments").limitToLast(50).on("child_added", snap => {
            let data = snap.val();
            let dan = document.createElement('div');
            dan.className = 'danmaku';
            dan.style.top = Math.random() * 70 + 10 + '%';
            dan.innerHTML = `<img src="${data.pfp}"> <span>${data.sender}: ${data.text}</span>`;
            document.getElementById('danmakuContainer').appendChild(dan);
            setTimeout(() => dan.remove(), 7000);
        });
    }
    function getMediaContent(text) {
        if(text.match(/\.(jpeg|jpg|gif|png)$/) || text.includes("postimg.cc")) {
            return `<img src="${text}">`;
        } else if(text.includes("youtube.com") || text.includes("youtu.be")) {
            let videoId = text.split('v=')[1] || text.split('youtu.be/')[1];
            return `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
        } else {
            return `<div>${text}</div>`;
        }
    }
    function renderPost(key, data) {
        let badge = artistsList.includes(data.sender.toUpperCase())? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
        let time = new Date(data.timestamp).toLocaleTimeString('sw-TZ', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('chatBox').innerHTML += `
            <div class="post">
                <div class="post-header">
                    <img class="post-pfp" src="${data.pfp}">
                    <div><div class="post-name">${data.sender}${badge}</div><div class="post-time">${time}</div></div>
                </div>
                <div class="post-content">${getMediaContent(data.text)}</div>
            </div>
        `;
    }
    function listenToChannel() {
        db.ref("channel_posts").limitToLast(30).on("child_added", snap => {
            renderPost(snap.key, snap.val());
        });
    }
    function sendPost() {
        if(!isArtist) return;
        let text = document.getElementById('msgInput').value.trim();
        if (!text) return;
        db.ref("channel_posts").push().set({sender: currentUser, pfp: currentPfp, text: text, timestamp: Date.now()});
        document.getElementById('msgInput').value = "";
    }
    async function openCamera() {
        document.getElementById('cameraModal').style.display = 'block';
        if(isArtist) document.getElementById('liveChatInput').style.display = 'flex';
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('cameraVideo').srcObject = cameraStream;
    }
    function closeCamera() {
        document.getElementById('cameraModal').style.display = 'none';
        document.getElementById('liveChatInput').style.display = 'none';
        if(cameraStream) cameraStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('liveComment').addEventListener("keypress", e => { if (e.key === "Enter") sendDanmaku(); });
</script>
</body>
</html>
