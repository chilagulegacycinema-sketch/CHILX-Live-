<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHILX LIVE CHANNEL</title>
<link rel="icon" href="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root {
        --bg:#010101; --card:#0A0A12; --border:#1E1E2E;
        --blue-neon:#00F0FF; --pink-neon:#FF00F5; --text:#E0E0FF; --error:#FF0040; --love:#FF3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; justify-content: center; overflow: hidden; }

    .app-container { width: 100%; max-width: 500px; background: #000; border-left: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; position: relative; }
   
    .header { background: #05050A; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); }
    .logo h1 { font-size: 18px; font-weight: 900; color: var(--blue-neon); }
    .logo h1 span { color: var(--pink-neon); }
    
    .live-status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--error); font-weight: 900; padding: 4px 8px; border-radius: 12px; background: rgba(255,0,64,0.1); }
    .live-dot { width: 8px; height: 8px; background: var(--error); border-radius: 50%; animation: blink 1s infinite; }

    .user-profile { display: flex; align-items: center; gap: 8px; }
    .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); }
    .user-name { font-size: 12px; font-weight: 700; color: var(--blue-neon); }
    .role-badge { font-size: 8px; background: var(--pink-neon); color: #000; padding: 2px 5px; border-radius: 4px; }

    .login-screen { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; background: var(--bg); position: absolute; top: 0; left: 0; z-index: 1000; }
    .login-screen img { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 20px; border: 3px solid var(--pink-neon); }
    .login-screen h2 { color: var(--blue-neon); margin-bottom: 5px; }
    .login-screen input { width: 90%; background: var(--card); border: 1px solid var(--blue-neon); color: #fff; padding: 14px; margin-bottom: 15px; border-radius: 8px; font-size: 16px; font-family: 'Orbitron'; text-align: center; }
    .login-screen button { background: linear-gradient(90deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; padding: 14px; width: 90%; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 16px; font-family: 'Orbitron'; margin-bottom: 10px; }
    .login-screen .viewer-btn { background: #333; color: var(--text); }

    .media-indicators { background: #050510; border-bottom: 1px solid var(--border); padding: 8px 15px; display: flex; justify-content: center; }
    .indicator-btn { background: linear-gradient(90deg, var(--blue-neon), var(--pink-neon)); border: none; padding: 8px 20px; border-radius: 20px; color: #000; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; }

    .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: rgba(10,10,18,0.4); }
    
    .post { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .post-pfp { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink-neon); }
    .post-name { font-size: 12px; font-weight: 700; color: var(--blue-neon); display: flex; align-items: center; gap: 4px; }
    
    .v-badge { width: 14px; height: 14px; background: #0095F6; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; }
    .v-badge svg { width: 9px; height: 9px; fill: #fff; }

    /* LOVE BUTTON */
    .love-btn { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; background: var(--love); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; z-index: 999; box-shadow: 0 0 20px var(--love); }
    .love-animation { position: absolute; font-size: 20px; color: var(--love); animation: fly 1s forwards; }
    @keyframes fly { 0%{opacity:1; transform:translateY(0) scale(1)} 100%{opacity:0; transform:translateY(-100px) scale(2)} }

    .input-area { padding: 15px; background: #05050A; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .chat-input { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px 18px; border-radius: 25px; font-family: 'Orbitron'; font-size: 14px; }
    .send-btn { background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-weight: 900; font-size: 18px; }

    /* CAMERA NA KOPAKOPA */
    #cameraModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 2000; }
    #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
    .live-overlay { position: absolute; top: 20px; left: 20px; background: var(--error); padding: 6px 14px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 900; }
    
    /* KOPAKOPA CONTAINER */
    #danmakuContainer { position: absolute; top: 80px; left: 0; width: 100%; height: calc(100% - 160px); pointer-events: none; overflow: hidden; }
    .danmaku { position: absolute; white-space: nowrap; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 2px 2px 4px #000; animation: danmakuMove 8s linear; display: flex; align-items: center; gap: 6px; }
    .danmaku img { width: 24px; height: 24px; border-radius: 50%; }
    @keyframes danmakuMove { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
    <h2>CHILX <span style="color:var(--pink-neon);">LIVE CHANNEL</span></h2>
    <p style="color:#888; font-size:11px; margin-bottom:25px;">WASANII SABA + WATAZAMAJI</p>
   
    <input type="text" id="loginName" placeholder="Weka Jina lako">
    <input type="text" id="loginPfp" placeholder="Weka Link ya Picha yako">
   
    <button onclick="loginAsArtist()">INGIA KAMA MSANII</button>
    <button class="viewer-btn" onclick="loginAsViewer()">INGIA KAMA MTAZAMAJI</button>
</div>

<div id="mainApp" class="app-container" style="display:none;">
    <div class="header">
        <div class="logo">
            <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
            <h1>CHILX <span>LIVE</span></h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="live-status">
                <div class="live-dot"></div>
                <span id="liveCount">0 LIVE</span>
            </div>
            <div class="user-profile" id="userProfile"></div>
        </div>
    </div>

    <div class="media-indicators" id="artistControls">
        <button class="indicator-btn" onclick="openCamera()">🔴 ANZA LIVE</button>
    </div>

    <div class="chat-area" id="chatBox"></div>

    <div class="input-area" id="artistInput">
        <input type="text" id="msgInput" class="chat-input" placeholder="Andika Post yako...">
        <button class="send-btn" onclick="sendPost()">></button>
    </div>

    <div class="love-btn" id="loveBtn" onclick="sendLove()">❤️</div>
</div>

<!-- CAMERA NA KOPAKOPA NDANI YAKE -->
<div id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="live-overlay">
        <div class="live-dot"></div>
        <span>LIVE • <span id="liveViewers">1</span> WAKITAZAMA</span>
    </div>
    <div id="danmakuContainer"></div>
    
    <!-- INPUT YA KOPAKOPA KWA WOTE -->
    <div style="position:absolute; bottom:20px; left:10px; right:10px; display:flex; gap:10px;">
        <input type="text" id="liveComment" placeholder="Tuma ujumbe..." style="flex:1; background:rgba(0,0,0,0.6); border:1px solid #fff; color:#fff; padding:10px; border-radius:20px; font-family:Orbitron;">
        <button onclick="sendDanmaku()" style="background:var(--pink-neon); border:none; padding:10px 15px; border-radius:20px; color:#000; font-weight:900;">TUMA</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";
    let currentPfp = "";
    let userRole = "";
    const artistsList = ["ZORAVALY", "PAUL", "WILLIAMS", "MASON", "SHANIYA", "IRENE", "ZAISAN"];
    let cameraStream = null;

    function loginAsArtist() {
        let name = document.getElementById('loginName').value.trim().toUpperCase();
        let pfp = document.getElementById('loginPfp').value.trim();
        if(!artistsList.includes(name)) { alert("Jina hili halipo kwenye orodha ya wasanii 7"); return; }
        if(!pfp) { alert("Weka link ya picha"); return; }
        setupUser(name, pfp, "artist");
    }

    function loginAsViewer() {
        let name = document.getElementById('loginName').value.trim();
        let pfp = document.getElementById('loginPfp').value.trim() || "https://i.postimg.cc/vBJj3bNH/chilx-live.jpg";
        if(!name) { alert("Weka jina lako"); return; }
        setupUser(name, pfp, "viewer");
    }

    function setupUser(name, pfp, role) {
        currentUser = name;
        currentPfp = pfp;
        userRole = role;
        localStorage.setItem('chilxUser', currentUser);
        localStorage.setItem('chilxPfp', currentPfp);
        localStorage.setItem('chilxRole', userRole);
        db.ref("online/" + currentUser).set({pfp: currentPfp, role: userRole});
        db.ref("online/" + currentUser).onDisconnect().remove();
        enterApp();
    }

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        let badge = artistsList.includes(currentUser) ? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
        document.getElementById('userProfile').innerHTML = `<img src="${currentPfp}"><div><div class="user-name">${currentUser}${badge}</div><div class="role-badge">${userRole}</div></div>`;
        if(userRole === "viewer") {
            document.getElementById('artistControls').style.display = 'none';
            document.getElementById('artistInput').style.display = 'none';
        }
        listenToOnlineCount();
        listenToChannel();
        listenToDanmaku(); // SIKILIZA KOPAKOPA
    }

    function listenToOnlineCount() {
        db.ref("online").on("value", snap => {
            let count = snap.numChildren();
            document.getElementById('liveCount').innerText = count + " LIVE";
            document.getElementById('liveViewers').innerText = count;
        });
    }

    // TUMA KOPAKOPA
    function sendDanmaku() {
        let text = document.getElementById('liveComment').value.trim();
        if(!text) return;
        db.ref("live_comments").push({
            sender: currentUser, pfp: currentPfp, text: text, time: Date.now()
        });
        document.getElementById('liveComment').value = "";
    }

    // SIKILIZA NA ONYESHA KOPAKOPA
    function listenToDanmaku() {
        db.ref("live_comments").limitToLast(50).on("child_added", snap => {
            let data = snap.val();
            showDanmaku(data);
        });
    }

    function showDanmaku(data) {
        let container = document.getElementById('danmakuContainer');
        let dan = document.createElement('div');
        dan.className = 'danmaku';
        dan.style.top = Math.random() * 70 + 10 + '%'; // random height
        dan.innerHTML = `<img src="${data.pfp}"> <span>${data.sender}: ${data.text}</span>`;
        container.appendChild(dan);
        setTimeout(() => dan.remove(), 8000);
    }

    function sendLove() {
        let love = document.createElement('div');
        love.className = 'love-animation';
        love.innerHTML = '❤️';
        love.style.left = Math.random() * 300 + 50 + 'px';
        love.style.bottom = '80px';
        document.body.appendChild(love);
        setTimeout(() => love.remove(), 1000);
    }

    function listenToChannel() {
        db.ref("channel_posts").limitToLast(30).on("child_added", function(snapshot) {
            let data = snapshot.val();
            renderPost(snapshot.key, data);
        });
    }

    function renderPost(key, data) {
        let badge = artistsList.includes(data.sender) ? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
        document.getElementById('chatBox').innerHTML += `
            <div class="post">
                <div class="post-header">
                    <img class="post-pfp" src="${data.pfp}">
                    <div class="post-name">${data.sender}${badge}</div>
                </div>
                <div>${data.text}</div>
            </div>
        `;
    }

    function sendPost() {
        if(userRole !== "artist") return;
        let text = document.getElementById('msgInput').value.trim();
        if (!text) return;
        db.ref("channel_posts").push().set({
            sender: currentUser, pfp: currentPfp, text: text, timestamp: Date.now()
        });
        document.getElementById('msgInput').value = "";
    }

    async function openCamera() {
        if(userRole !== "artist") return;
        document.getElementById('cameraModal').style.display = 'block';
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        document.getElementById('cameraVideo').srcObject = cameraStream;
    }

    document.getElementById('liveComment').addEventListener("keypress", function(e) { if (e.key === "Enter") sendDanmaku(); });
</script>
</body>
</html>
