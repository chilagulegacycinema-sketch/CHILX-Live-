<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHILX LIVE CHANNEL</title>
<link rel="icon" href="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    :root {
        --bg:#010101; --card:#0A0A12; --border:#1E1E2E;
        --blue-neon:#00F0FF; --pink-neon:#FF00F5; --text:#E0E0FF; --error:#FF0040;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; justify-content: center; overflow: hidden; }

    .app-container { width: 100%; max-width: 500px; background: #000; border-left: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
   
    .header { background: #05050A; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 15px rgba(0,240,255,0.1); }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); box-shadow: 0 0 10px var(--blue-neon); }
    .logo h1 { font-size: 18px; font-weight: 900; color: var(--blue-neon); text-shadow: 0 0 8px var(--blue-neon); }
    .logo h1 span { color: var(--pink-neon); text-shadow: 0 0 8px var(--pink-neon); }
    
    /* HII NDIO YA KWANZA ILIYOKUWA SAFI */
    .live-status { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--error); font-weight: 900; cursor: pointer; padding: 4px 8px; border-radius: 12px; background: rgba(255,0,64,0.1); }
    .live-status:hover { background: rgba(255,0,64,0.2); }
    .live-dot { width: 8px; height: 8px; background: var(--error); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .user-profile { display: flex; align-items: center; gap: 8px; }
    .user-profile img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--blue-neon); }
    .user-name { font-size: 12px; font-weight: 700; color: var(--blue-neon); display: flex; align-items: center; gap: 4px; }

    .login-screen { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; background: var(--bg); position: absolute; top: 0; left: 0; z-index: 1000; }
    .login-screen img { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 20px; border: 3px solid var(--pink-neon); }
    .login-screen h2 { color: var(--blue-neon); text-shadow: 0 0 10px var(--blue-neon); }
    .login-screen input { width: 90%; background: var(--card); border: 1px solid var(--blue-neon); color: #fff; padding: 14px; margin: 15px 0; border-radius: 8px; font-size: 16px; font-family: 'Orbitron'; text-align: center; }
    .login-screen button { background: linear-gradient(90deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; padding: 14px; width: 90%; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 16px; font-family: 'Orbitron'; }

    .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: rgba(10,10,18,0.4); }
    
    .post { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .post-header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .post-pfp { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink-neon); }
    .post-name { font-size: 12px; font-weight: 700; color: var(--blue-neon); }
    
    .v-badge { width: 14px; height: 14px; background: #0095F6; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; }
    .v-badge svg { width: 9px; height: 9px; fill: #fff; }

    /* LOVE YA CHILX ICON */
    .love-btn { position: fixed; bottom: 80px; right: 20px; width: 50px; height: 50px; background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon)); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 999; box-shadow: 0 0 20px var(--pink-neon); }
    .love-btn svg { width: 28px; height: 28px; fill: #000; }
    .love-animation { position: absolute; animation: fly 1.5s forwards; }
    .love-animation svg { width: 25px; height: 25px; fill: var(--pink-neon); filter: drop-shadow(0 0 5px var(--pink-neon)); }
    @keyframes fly { 0%{opacity:1; transform:translateY(0) scale(1)} 100%{opacity:0; transform:translateY(-120px) scale(1.5)} }

    .input-area { padding: 15px; background: #05050A; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .chat-input { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px 18px; border-radius: 25px; font-family: 'Orbitron'; font-size: 14px; }
    .send-btn { background: linear-gradient(135deg, var(--blue-neon), var(--pink-neon)); color: #000; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-weight: 900; font-size: 18px; }

    /* CAMERA NA KOPAKOPA RASMI */
    #cameraModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 2000; }
    #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
    .live-overlay { position: absolute; top: 20px; left: 20px; background: var(--error); padding: 6px 14px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 900; }
    
    #danmakuContainer { position: absolute; top: 80px; left: 0; width: 100%; height: calc(100% - 160px); pointer-events: none; overflow: hidden; }
    .danmaku { position: absolute; white-space: nowrap; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 0 5px #000; animation: danmakuMove 7s linear; display: flex; align-items: center; gap: 6px; background: rgba(0,240,255,0.1); padding: 4px 10px; border-radius: 15px; border: 1px solid var(--blue-neon); }
    .danmaku img { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--pink-neon); }
    @keyframes danmakuMove { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
    <h2>CHILX <span style="color:var(--pink-neon);">LIVE</span></h2>
    <input type="text" id="loginName" placeholder="Weka Jina lako">
    <input type="text" id="loginPfp" placeholder="Weka Link ya Picha yako: postimg.cc">
    <button onclick="join()">INGIA KWENYE CHANNEL</button>
</div>

<div id="mainApp" class="app-container" style="display:none;">
    <div class="header">
        <div class="logo">
            <img src="https://i.postimg.cc/vBJj3bNH/chilx-live.jpg" alt="Logo">
            <h1>CHILX <span>LIVE</span></h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <!-- HII NDIO YA KWANZO -->
            <div class="live-status" onclick="handleLiveClick()">
                <div class="live-dot"></div>
                <span id="liveCount">0 LIVE</span>
            </div>
            <div class="user-profile" id="userProfile"></div>
        </div>
    </div>

    <div class="chat-area" id="chatBox"></div>

    <div class="input-area" id="artistInput">
        <input type="text" id="msgInput" class="chat-input" placeholder="Andika Post yako...">
        <button class="send-btn" onclick="sendPost()">></button>
    </div>

    <!-- ICON YA CHILX RASMI KWA LIKE -->
    <div class="love-btn" id="loveBtn" onclick="sendLove()">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
</div>

<div id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="live-overlay">
        <div class="live-dot"></div>
        <span>LIVE • <span id="liveViewers">1</span> WAKITAZAMA</span>
    </div>
    <div id="danmakuContainer"></div>
    <div style="position:absolute; bottom:20px; left:10px; right:10px; display:flex; gap:10px;">
        <input type="text" id="liveComment" placeholder="Tuma ujumbe..." style="flex:1; background:rgba(0,0,0,0.6); border:1px solid var(--blue-neon); color:#fff; padding:10px; border-radius:20px; font-family:Orbitron;">
        <button onclick="sendDanmaku()" style="background:var(--pink-neon); border:none; padding:10px 15px; border-radius:20px; color:#000; font-weight:900;">TUMA</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";
    let currentPfp = "";
    const artistsList = ["ZORAVALY", "PAUL", "WILLIAMS", "MASON", "SHANIYA", "IRENE", "ZAISAN"];
    let cameraStream = null;
    let isArtist = false;

    window.onload = function() {
        let savedUser = localStorage.getItem('chilxUser');
        let savedPfp = localStorage.getItem('chilxPfp');
        if(savedUser && savedPfp) {
            currentUser = savedUser; currentPfp = savedPfp;
            isArtist = artistsList.includes(currentUser.toUpperCase());
            enterApp();
        }
    }

    function join() {
        let name = document.getElementById('loginName').value.trim();
        let pfp = document.getElementById('loginPfp').value.trim();
        if(!name || !pfp) { alert("Jaza majina yote"); return; }
        currentUser = name; currentPfp = pfp;
        isArtist = artistsList.includes(currentUser.toUpperCase());
        localStorage.setItem('chilxUser', currentUser);
        localStorage.setItem('chilxPfp', currentPfp);
        db.ref("online/" + currentUser).set({pfp: currentPfp});
        db.ref("online/" + currentUser).onDisconnect().remove();
        enterApp();
    }

    function enterApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        let badge = isArtist ? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
        document.getElementById('userProfile').innerHTML = `<img src="${currentPfp}"><div class="user-name">${currentUser}${badge}</div>`;
        if(!isArtist) document.getElementById('artistInput').style.display = 'none';
        listenToOnlineCount();
        listenToChannel();
        listenToDanmaku();
    }

    // KUBONYEZA LIVE
    function handleLiveClick() {
        if(isArtist) {
            openCamera(); // Msanii aanze live
        } else {
            openCamera(); // Mtazamaji aingie kutazama tu
        }
    }

    function listenToOnlineCount() {
        db.ref("online").on("value", snap => {
            let count = snap.numChildren();
            document.getElementById('liveCount').innerText = count + " LIVE";
            document.getElementById('liveViewers').innerText = count;
        });
    }

    function sendLove() {
        let love = document.createElement('div');
        love.className = 'love-animation';
        love.style.left = Math.random() * 300 + 50 + 'px';
        love.style.bottom = '80px';
        love.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        document.body.appendChild(love);
        setTimeout(() => love.remove(), 1500);
    }

    function sendDanmaku() {
        let text = document.getElementById('liveComment').value.trim();
        if(!text) return;
        db.ref("live_comments").push({sender: currentUser, pfp: currentPfp, text: text});
        document.getElementById('liveComment').value = "";
    }
    function listenToDanmaku() {
        db.ref("live_comments").limitToLast(50).on("child_added", snap => {
            let data = snap.val();
            let container = document.getElementById('danmakuContainer');
            let dan = document.createElement('div');
            dan.className = 'danmaku';
            dan.style.top = Math.random() * 70 + 10 + '%';
            dan.innerHTML = `<img src="${data.pfp}"> <span>${data.sender}: ${data.text}</span>`;
            container.appendChild(dan);
            setTimeout(() => dan.remove(), 7000);
        });
    }

    function listenToChannel() {
        db.ref("channel_posts").limitToLast(30).on("child_added", snap => {
            let data = snap.val();
            let badge = artistsList.includes(data.sender.toUpperCase()) ? '<span class="v-badge"><svg viewBox="0 0 24 24"><path d="M12 2L3 5l9 19 9-19-9-3z"/></svg></span>' : '';
            document.getElementById('chatBox').innerHTML += `<div class="post"><div class="post-header"><img class="post-pfp" src="${data.pfp}"><div class="post-name">${data.sender}${badge}</div></div><div>${data.text}</div></div>`;
        });
    }
    function sendPost() {
        if(!isArtist) return;
        let text = document.getElementById('msgInput').value.trim();
        if (!text) return;
        db.ref("channel_posts").push().set({sender: currentUser, pfp: currentPfp, text: text, timestamp: Date.now()});
        document.getElementById('msgInput').value = "";
    }
    async function openCamera() {
        document.getElementById('cameraModal').style.display = 'block';
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('cameraVideo').srcObject = cameraStream;
    }
    document.getElementById('liveComment').addEventListener("keypress", e => { if (e.key === "Enter") sendDanmaku(); });
</script>
</body>
</html>
